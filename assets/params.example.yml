# Example parameter file. Copy and edit, then run:
#   python main.py --config params.yml

reads: 'data/*_{1,2}.fastq.gz'
outdir: results

# Restart from an intermediate FASTA instead of raw reads:
# unitigs: sample.unitigs.fasta
# unclassified: sample.unclassified.fasta
# orfs: sample.orfs.faa
# start_from: auto

kraken_db: /data/dbs/kraken2
seqscreen_db: /data/dbs/seqscreen_databases
foldseek_db: /data/dbs/foldseek/pdb

# Hugging Face ESMFold (facebook/esmfold_v1 by default).
# Use a local snapshot path for fully offline runs.
esmfold_model: facebook/esmfold_v1
esmfold_cache: /data/models/huggingface
esmfold_device: auto
esmfold_num_recycles: 4
esmfold_chunk_size: 128

min_contig_len: 200
min_orf_aa: 50
max_orf_aa: 1024
require_orf_start: true

skip_esmfold: false
skip_foldseek: false
foldseek_evalue: 0.001
foldseek_sensitivity: 9.5
foldseek_max_seqs: 100

threads: 16
memory_gb: 64
ggcat_kmer: 31
ggcat_min_multiplicity: 2
kraken2_confidence: 0.01
